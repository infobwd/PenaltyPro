<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- /vite.svg ไม่มีอยู่จริงในโปรเจกต์นี้ ทำให้ 404 ทุกครั้งที่โหลดหน้า -->
    <link rel="icon" href="https://raw.githubusercontent.com/noppharutlubbuangam-dot/vichakan/refs/heads/main/cup.gif" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Penalty Pro Recorder</title>
    
    <!-- PWA Settings -->
    <!-- path เด็ดขาด ไม่ใช่ ./ — ไม่งั้น Vite จะ bundle เป็น assets/manifest-<hash>.json
         แล้ว PWA หา manifest ไม่เจอ ไฟล์จริงอยู่ใน public/ ซึ่ง Vite คัดลอกตรงไป dist/ -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PenaltyPro" />
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/noppharutlubbuangam-dot/vichakan/refs/heads/main/cup.gif" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Kanit', sans-serif;
        background-color: #f8fafc;
        overscroll-behavior-y: none; /* Prevent pull-to-refresh on mobile */
      }
      .font-sarabun {
        font-family: 'Sarabun', sans-serif;
      }
      /* Custom scrollbar for cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      .safe-area-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }

      /* มีโมดัลเปิดอยู่ = ล็อกไม่ให้พื้นหลังเลื่อน
         ไม่งั้นเวลาปัดในโมดัลจนสุด นิ้วจะไปพาหน้าเบื้องหลังเลื่อนแทน (scroll chaining)
         ซึ่งบนมือถือทำให้ตำแหน่งที่กรอกค้างไว้หายไปเลย */
      body.modal-open { overflow: hidden !important; touch-action: none; }
      .modal-sheet { overscroll-behavior: contain; }

      /* โมดัลบนมือถือ/แท็บเล็ต = bottom sheet
         กล่องกลางจอบนมือถือทำให้เนื้อหายาว ๆ (ฟอร์มแก้ทีม รายชื่อนักกีฬา)
         ถูกบีบจนต้องเลื่อนสองชั้น และปุ่มล่างมักตกไปใต้แป้นพิมพ์
         เลื่อนขึ้นมาจากขอบล่างแทน จะกดด้วยนิ้วโป้งได้และเห็นเนื้อหาเต็มความสูง */
      @media (max-width: 1023px) {
        .modal-sheet { align-items: flex-end !important; padding: 0 !important; }
        .modal-sheet > div:not([class*="max-w-none"]) {
          width: 100% !important;
          max-width: 100% !important;
          max-height: 92vh !important;
          border-bottom-left-radius: 0 !important;
          border-bottom-right-radius: 0 !important;
          border-top-left-radius: 1.5rem !important;
          border-top-right-radius: 1.5rem !important;
          animation: sheet-up .22s cubic-bezier(.32,.72,0,1);
        }
        @keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "canvas-confetti": "https://aistudiocdn.com/canvas-confetti@^1.9.4",
    "html2canvas": "https://aistudiocdn.com/html2canvas@^1.4.1",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "path": "https://aistudiocdn.com/path@^0.12.7",
    "url": "https://aistudiocdn.com/url@^0.11.4"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // เฝ้าดูว่ามีโมดัลเปิดอยู่ไหม แล้วล็อก/ปลดล็อกการเลื่อนของพื้นหลังให้อัตโนมัติ
      // ทำที่นี่ที่เดียวเพราะโมดัลกระจายอยู่หลายคอมโพเนนต์ ถ้าไปใส่ทีละที่จะลืมบางจุด
      (function () {
        var sync = function () {
          var open = document.querySelector('.modal-sheet') !== null;
          document.body.classList.toggle('modal-open', open);
        };
        new MutationObserver(sync).observe(document.documentElement,
          { childList: true, subtree: true });
        sync();
      })();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
