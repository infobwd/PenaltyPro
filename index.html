<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- /vite.svg ไม่มีอยู่จริงในโปรเจกต์นี้ ทำให้ 404 ทุกครั้งที่โหลดหน้า -->
    <link rel="icon" href="https://raw.githubusercontent.com/noppharutlubbuangam-dot/vichakan/refs/heads/main/cup.gif" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Penalty Pro Recorder</title>
    
    <!-- PWA Settings -->
    <!-- path เด็ดขาด ไม่ใช่ ./ — ไม่งั้น Vite จะ bundle เป็น assets/manifest-<hash>.json
         แล้ว PWA หา manifest ไม่เจอ ไฟล์จริงอยู่ใน public/ ซึ่ง Vite คัดลอกตรงไป dist/ -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PenaltyPro" />
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/noppharutlubbuangam-dot/vichakan/refs/heads/main/cup.gif" />

    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "canvas-confetti": "https://aistudiocdn.com/canvas-confetti@^1.9.4",
    "html2canvas": "https://aistudiocdn.com/html2canvas@^1.4.1",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "path": "https://aistudiocdn.com/path@^0.12.7",
    "url": "https://aistudiocdn.com/url@^0.11.4"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // เฝ้าดูว่ามีโมดัลเปิดอยู่ไหม แล้วล็อก/ปลดล็อกการเลื่อนของพื้นหลังให้อัตโนมัติ
      // ทำที่นี่ที่เดียวเพราะโมดัลกระจายอยู่หลายคอมโพเนนต์ ถ้าไปใส่ทีละที่จะลืมบางจุด
      (function () {
        var lockedScrollY = 0;
        var sync = function () {
          var open = document.querySelector('.modal-sheet') !== null;
          var locked = document.body.classList.contains('modal-open');
          if (open && !locked) {
            lockedScrollY = window.scrollY || document.documentElement.scrollTop || 0;
            document.body.style.setProperty('--modal-lock-top', '-' + lockedScrollY + 'px');
            document.body.classList.add('modal-open');
          } else if (!open && locked) {
            document.body.classList.remove('modal-open');
            document.body.style.removeProperty('--modal-lock-top');
            window.scrollTo(0, lockedScrollY);
          }
        };
        new MutationObserver(sync).observe(document.documentElement,
          { childList: true, subtree: true });
        sync();
      })();

      // ไม่ลง service worker ตอนพัฒนาในเครื่อง — SW จะแคช shell ไว้แล้วทับ
      // การอัปเดตสด ๆ ของ Vite ทำให้แก้โค้ดแล้วหน้าไม่เปลี่ยนจนกว่าจะล้างแคชเอง
      var isLocal = ['localhost', '127.0.0.1', '::1'].indexOf(location.hostname) !== -1;
      if ('serviceWorker' in navigator && !isLocal) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (err) {
            console.warn('ลงทะเบียน service worker ไม่สำเร็จ', err);
          });
        });
      } else if (isLocal && 'serviceWorker' in navigator) {
        // ถอน SW ที่อาจค้างจากการทดสอบครั้งก่อน ไม่งั้นจะเสิร์ฟ shell เก่าให้ dev server
        navigator.serviceWorker.getRegistrations()
          .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
          .catch(function () {});
      }
    </script>
  </body>
</html>
